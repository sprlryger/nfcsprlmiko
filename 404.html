<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · SM TAP</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon-64.png">
<style>
@font-face{font-family:"Steelfish";src:url(/assets/steelfish.otf) format("opentype");font-display:swap}
:root{--bg:#0b0b0c;--tx:#e9e9ec;--mu:#9a9aa2;--line:#2a2a2e;--ac:#d4271c;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f4f4f6;--tx:#111114;--mu:#5a5a64;--line:#d6d6dc;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--tx);font:400 16px/1.6 "Manrope",system-ui,Arial,sans-serif;text-align:center}
h1{font:400 clamp(96px,22vw,200px)/.9 "Steelfish","Arial Narrow",Impact,sans-serif;letter-spacing:.02em}
p{color:var(--mu);margin:18px auto 32px;max-width:36ch}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border:1px solid var(--tx);border-radius:4px;color:var(--bg);background:var(--tx);text-decoration:none;font-weight:600}
a:hover{background:var(--ac);border-color:var(--ac);color:#fff}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p>Такой страницы нет. Возможно, ссылка устарела или в адресе опечатка.</p>
